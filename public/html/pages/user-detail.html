<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – ZooNet</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="/pages/wall.html" class="nav-logo">
      <span class="logo-icon">◈</span> ZooNet
    </a>
    <div class="nav-links">
      <a href="/pages/wall.html" class="nav-link">Wall</a>
      <a href="/pages/users.html" class="nav-link">Users</a>
      <button id="logout-btn" class="btn btn-outline btn-sm">Log out</button>
    </div>
    <button class="nav-hamburger" id="nav-hamburger">&#9776;</button>
  </nav>

  <div class="nav-mobile-menu hidden" id="nav-mobile-menu">
    <a href="/pages/wall.html" class="nav-link">Wall</a>
    <a href="/pages/users.html" class="nav-link">Users</a>
    <button id="logout-btn-mobile" class="btn btn-outline btn-sm">Log out</button>
  </div>

  <main class="container">

    <section id="user-profile" class="user-profile-card">
      <div class="loading">Loading profile…</div>
    </section>

    <section class="feed-section">
      <h2 class="section-title">User's Posts</h2>
      <div id="own-posts-container">
        <div class="loading">Loading posts…</div>
      </div>
    </section>

    <section class="feed-section">
      <h2 class="section-title">Activity (liked / commented posts)</h2>
      <div id="activity-container">
        <div class="loading">Loading activity…</div>
      </div>
    </section>

  </main>

  <template id="post-template">
    <article class="post-card">
      <div class="post-header">
        <img class="post-avatar" src="" alt="avatar" />
        <div class="post-meta">
          <a class="post-author" href=""></a>
          <span class="post-date"></span>
        </div>
        <button class="btn btn-danger btn-sm post-delete hidden">Delete</button>
      </div>
      <h3 class="post-title"></h3>
      <p class="post-text"></p>
      <img class="post-image hidden" src="" alt="post image" />
      <div class="post-actions">
        <button class="btn-like">
          <span class="like-icon">♥</span>
          <span class="like-count"></span>
        </button>
        <span class="comment-count-label"></span>
      </div>
      <div class="likes-list hidden"></div>
      <div class="comments-section">
        <div class="comments-list"></div>
        <form class="comment-form">
          <input type="text" class="comment-input" placeholder="Add a comment…" required />
          <button type="submit" class="btn btn-primary btn-sm">Send</button>
        </form>
      </div>
    </article>
  </template>

  <footer class="site-footer">made by kenza</footer>

  <script src="/js/user-detail.js"></script>
</body>
</html>
